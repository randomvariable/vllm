# Tekton build harness for the DGX Spark (CUDA sm_121a) vLLM runtime image.
#
# Lives in the public vllm fork so the pipeline travels with the source it
# builds. Every infrastructure-specific value (registry, build
# node, BuildKit cache PVC, pull secrets) is templated via PAC Repository
# params resolved from the cluster-side Repository CRD -- the fork itself
# carries no infra specifics (memory #3980).
#
# Builds the fork's own source at the pushed revision: PAC injects
# repo_url/revision from the push event (always the event HEAD, never a
# stale YAML literal), git-clone materialises it (shallow superproject,
# full recursive submodules) into the source workspace, and buildctl builds
# from there.
#
# The trigger fires on image-input pushes to homelabs-main and on verified
# release tags. Release tags are immutable homelabs-verified-YYYY.MM.DD refs;
# one cross-build publishes Harbor and GHCR names from the same BuildKit solve.
# Cluster-side Repository params provide registry and secret values.
#
# Cross-compiled on an x86_64 BuildKit node using NVIDIA's SBSA cross toolkit +
# native nvcc with an aarch64 host compiler. The runtime stage runs under
# qemu-aarch64 (binfmt_misc registered on the build node host).
---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: vllm-build-on-push-spark
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "push" && (
        target_branch.matches('^refs/tags/homelabs-verified-[0-9]{4}\\.[0-9]{2}\\.[0-9]{2}$') ||
        (target_branch == "homelabs-main" && (
          ".tekton/spark-build-on-push.yaml".pathChanged() ||
          !files.all.all(x,
            x.matches('^docs/') ||
            x.matches('^tests/') ||
            x.matches('^examples/') ||
            x.matches('^benchmarks/') ||
            x.matches('^\\.github/') ||
            x.matches('^\\.tekton/') ||
            x.matches('\\.md$')
          )
        ))
      )
    # A newer homelabs-main push makes an in-flight moving-tag build obsolete.
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "10"
    pipelinesascode.tekton.dev/task: "git-clone"
spec:
  timeouts:
    pipeline: 8h0m0s
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: git_ref
      value: "{{ target_branch }}"
    - name: ghcr_image
      value: "{{ spark_ghcr_image }}"
    - name: github_release_secret
      value: "{{ github_release_secret }}"
  taskRunTemplate:
    serviceAccountName: "{{ service_account }}"
    podTemplate:
      nodeSelector:
        kubernetes.io/arch: amd64
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  # Dedicated x86_64 CI node for the sm_121a cross-compile; its
                  # warm BuildKit cache is backed by a persistent PVC. qemu-aarch64
                  # binfmt_misc is registered on the node host kernel.
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["{{ build_node }}"]
      imagePullSecrets: [{name: "{{ pull_secret }}"}]
      securityContext: {fsGroup: 65532}
  workspaces:
    # Ephemeral per-run source; the warm cross-compile caches live on the
    # buildkitd PVC below, not here.
    - name: source
      volumeClaimTemplate:
        spec:
          storageClassName: "{{ storage_class }}"
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 20Gi
  pipelineSpec:
    params:
      - {name: repo_url, type: string}
      - {name: revision, type: string}
      - {name: git_ref, type: string}
      - {name: ghcr_image, type: string}
      - {name: github_release_secret, type: string}
    workspaces:
      - name: source
    tasks:
      - name: clone
        taskRef:
          name: git-clone
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: depth
            value: "1"
          - name: submodules
            value: "true"
          - name: deleteExisting
            value: "true"
        workspaces:
          - name: output
            workspace: source
      - name: build-and-push
        runAfter: [clone]
        params:
          - {name: git_ref, value: $(params.git_ref)}
          - {name: ghcr_image, value: $(params.ghcr_image)}
        timeout: 8h0m0s
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          params:
            - {name: git_ref, type: string}
            - {name: ghcr_image, type: string}
          workspaces:
            - name: source
          results:
            - name: IMAGE_REF
            - name: IMAGE_TAG
            - name: PUSH_REF
          steps:
            - name: fix-permissions
              image: ubuntu:24.04
              securityContext: {runAsUser: 0, runAsGroup: 0}
              volumeMounts: [{name: buildkitd, mountPath: /buildkit-cache}]
              script: |
                #!/bin/sh
                set -eu
                chown -R 1000:1000 /buildkit-cache
            - name: buildctl-build
              image: moby/buildkit:master-rootless
              workingDir: $(workspaces.source.path)
              securityContext:
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile: {type: Unconfined}
                appArmorProfile: {type: Unconfined}
              # Leave at least the kubelet eviction reserve plus the node's
              # resident workload footprint. Parallelism is constrained in the
              # Dockerfile; this cgroup limit converts any miss into a retained
              # task failure rather than evicting the node's Pod.
              computeResources:
                requests:
                  memory: 40Gi
                limits:
                  memory: 44Gi
              env:
                - {name: DOCKER_CONFIG, value: /tmp/docker}
                - {name: HARBOR_REGISTRY, value: "{{ harbor_registry }}"}
                - {name: IMAGE_NAME, value: "{{ spark_harbor_image }}"}
              script: |
                #!/bin/sh
                set -eu
                mkdir -p /tmp/docker
                cp /home/user/.docker/config.json /tmp/docker/config.json
                # git-clone already materialised the fork at the push revision
                # (shallow superproject, recursive submodules) into the source
                # workspace. Public repo: no token needed, and the Dockerfile
                # COPYs the source (no secret mount).
                SRC="$(workspaces.source.path)"
                # SHAs come from the clone task's results. No git runs in this
                # step: the build image's git refuses the workspace anyway
                # (dubious ownership across the two task runs' UIDs on the
                # shared PVC), and the results are authoritative.
                FULL_SHA="$(tasks.clone.results.commit)"
                SHORT_SHA="$(printf '%s' "$FULL_SHA" | cut -c1-7)"
                GIT_REF="$(params.git_ref)"
                RELEASE_TAG=""
                case "$GIT_REF" in
                  refs/tags/homelabs-verified-*)
                    RELEASE_TAG="${GIT_REF#refs/tags/}"
                    CALVER="${RELEASE_TAG#homelabs-verified-}"
                    NORMALIZED_DATE="$(printf '%s' "$CALVER" | tr . -)"
                    if [ "$(date -u -d "$NORMALIZED_DATE" +%Y.%m.%d 2>/dev/null)" != "$CALVER" ]; then
                      echo "Invalid homelabs verified CalVer: $RELEASE_TAG" >&2
                      exit 1
                    fi
                    ;;
                esac
                IMAGE_REF="${HARBOR_REGISTRY}/${IMAGE_NAME}:${SHORT_SHA}"
                PUSH_NAMES="${IMAGE_REF},${HARBOR_REGISTRY}/${IMAGE_NAME}:latest"
                PUSH_REF="$IMAGE_REF"
                if [ -n "$RELEASE_TAG" ]; then
                  GHCR_IMAGE="$(params.ghcr_image)"
                  PUSH_REF="${GHCR_IMAGE}:${CALVER}"
                  PUSH_NAMES="${PUSH_NAMES},${PUSH_REF},${GHCR_IMAGE}:${SHORT_SHA}"
                fi
                # The Dockerfile excludes .git from the context so identical
                # source yields an identical COPY layer across runs; the commit
                # and the setuptools-scm version it can no longer derive are
                # handed over explicitly. 0.1.dev1+g<9-char sha> reproduces what
                # setuptools-scm produced from the shallow clone.
                SCM_VERSION="0.1.dev1+g$(printf '%s' "$FULL_SHA" | cut -c1-9)"
                LOG_DIR=/home/user/.local/share/buildkit/logs
                mkdir -p "$LOG_DIR"
                LOG_FILE="$LOG_DIR/spark-${SHORT_SHA}.log"
                LOG_PIPE="$LOG_DIR/.spark-${SHORT_SHA}.pipe"
                rm -f "$LOG_PIPE"
                mkfifo "$LOG_PIPE"
                tee -a "$LOG_FILE" < "$LOG_PIPE" &
                LOG_TEE_PID=$!
                exec > "$LOG_PIPE" 2>&1
                echo "Persisting build log to $LOG_FILE"
                # Concurrency guard on the shared PVC-backed BuildKit state root.
                #
                # buildkitd.lock is an flock, not a PID file: buildkitd holds it
                # for its lifetime and the kernel releases it when the process
                # dies, so a crashed build leaves a file but no held lock. The
                # previous unconditional "rm -f" was therefore never needed for
                # the stale case, and was actively dangerous in the overlapping
                # case -- deleting the file while another PipelineRun's buildkitd
                # holds it gives the new buildkitd a fresh inode to lock, so two
                # live daemons end up mutating one state root and corrupt it.
                # (Both runs land on the same node with the same PVC, so their
                # flocks are on the same kernel and do serialise -- if left alone.)
                #
                # Probe non-blocking instead: if the lock is free the run
                # proceeds (stale files are harmless, buildkitd reuses them); if
                # it is held, another run is live, so fail fast with a clear
                # message rather than racing it. A PID-liveness check is not
                # possible here -- pods have separate PID namespaces.
                BUILDKIT_ROOT=/home/user/.local/share/buildkit
                if command -v flock >/dev/null 2>&1; then
                  if ! flock -n "${BUILDKIT_ROOT}/buildkitd.lock" -c true; then
                    echo "Another PipelineRun holds ${BUILDKIT_ROOT}/buildkitd.lock;" >&2
                    echo "refusing to run concurrently against the shared BuildKit" >&2
                    echo "state root. Re-run once the in-flight build finishes." >&2
                    exit 1
                  fi
                fi
                # buildkitd ran with no config at all, so it applied the default
                # GC policy on every start. Measured across three consecutive
                # runs: each executing step got a freshly created cache-mount
                # record, ccache reported "Files: 0" at stage entry, and total
                # BuildKit storage fell from 43.4GB to 33.5GB between runs. The
                # only mount that survived (//root/.cache/uv, since July) belongs
                # to a step whose layer is cached and therefore never re-runs.
                #
                # Net effect: the FlashInfer AOT and vLLM wheel stages recompiled
                # from an empty ccache every single time -- roughly three hours
                # of work whose whole purpose was to be cached.
                #
                # reservedSpace is what GC will not reclaim. The PVC is 400Gi, not
                # the 200GB this comment previously assumed, so the old
                # 150GB/160GB pair capped BuildKit at 40% of the volume and made
                # GC reclaim layers and cache mounts that there was room to keep.
                # The working set is the ~95GB layer store plus a 100G ccache
                # (CCACHE_MAXSIZE in the builder stage), so reserve 280GB and cap
                # at 320GB, leaving the volume's own headroom.
                #
                # Those worker-level fields alone did NOT stop the wipes, because
                # they do not replace the default policy list. buildkitd only
                # falls back to config.DefaultGCPolicy when the gcpolicy array is
                # empty (cmd/buildkitd/main.go: `if len(cfg.GCPolicy) == 0`), and
                # that default's FIRST rule hard-codes
                #   filters      = ["type==source.local", "type==exec.cachemount",
                #                   "type==source.git.checkout"]
                #   maxUsedSpace = 512MB
                # so every cache mount above 512MB was still evicted once it went
                # 48h unused -- our ccache is sized 100G. Measured directly: the
                # run after a successful 2114-object FlashInfer stage still
                # reported "Files: 0" at stage entry.
                #
                # Stating the array explicitly suppresses that default entirely.
                # Rule 1 keeps cache mounts (ccache, cubins, uv, cargo, the CMake
                # binary dir) under the same budget as everything else instead of
                # 512MB. Rule 2 is the general cap, and rule 3 (all = true) is the
                # last-resort sweep the default list also ends with.
                mkdir -p /home/user/.config/buildkit
                cat > /home/user/.config/buildkit/buildkitd.toml <<'BKCONF'
                root = "/home/user/.local/share/buildkit"

                [worker.oci]
                  enabled = true
                  gc = true
                  reservedSpace = "280GB"
                  maxUsedSpace = "320GB"
                  minFreeSpace = "20GB"

                  [[worker.oci.gcpolicy]]
                    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
                    reservedSpace = "280GB"
                    maxUsedSpace = "320GB"
                    minFreeSpace = "20GB"

                  [[worker.oci.gcpolicy]]
                    reservedSpace = "280GB"
                    maxUsedSpace = "320GB"
                    minFreeSpace = "20GB"

                  [[worker.oci.gcpolicy]]
                    all = true
                    reservedSpace = "280GB"
                    maxUsedSpace = "320GB"
                    minFreeSpace = "20GB"
                BKCONF
                echo "== buildkitd config =="
                cat /home/user/.config/buildkit/buildkitd.toml
                # Verbose cross-compile output exceeds BuildKit's defaults (2MiB
                # per step, 200KiB/s), which truncated the FlashInfer layer
                # mid-build and hid everything after it. Read by buildkitd, not
                # buildctl. Logs stream to the pod and are rotated by kubelet
                # (256MiB x 10 here), never stored in etcd, so this does not
                # affect Tekton object size.
                #
                # Size is raised to a bounded 128MiB rather than unlimited: this
                # layer alone is ~3400 compile units and verbose output is the
                # dominant term, so -1 risks a multi-hundred-MiB log that rotates
                # its own early history away. The rate cap is disabled outright
                # since parallel compiles are inherently bursty.
                BUILDKIT_STEP_LOG_MAX_SIZE=134217728 \
                BUILDKIT_STEP_LOG_MAX_SPEED=-1 \
                rootlesskit buildkitd --oci-worker-no-process-sandbox \
                  --config /home/user/.config/buildkit/buildkitd.toml &
                BKPID=$!
                cleanup() {
                  status=$?
                  kill "$BKPID" 2>/dev/null || true
                  wait "$BKPID" 2>/dev/null || true
                  exit "$status"
                }
                trap cleanup EXIT
                retries=0
                while [ ! -S /run/user/1000/buildkit/buildkitd.sock ] && [ "$retries" -lt 30 ]; do
                  # Backstop for the probe's TOCTOU window: if a competing run
                  # grabbed the lock between the probe and here, buildkitd exits
                  # immediately rather than waiting out the full 30s timeout.
                  if ! kill -0 "$BKPID" 2>/dev/null; then
                    echo "buildkitd exited during startup; the shared BuildKit state" >&2
                    echo "root is most likely locked by a concurrent PipelineRun." >&2
                    exit 1
                  fi
                  sleep 1
                  retries=$((retries + 1))
                done
                if [ ! -S /run/user/1000/buildkit/buildkitd.sock ]; then
                  echo "BuildKit socket did not appear after 30 seconds" >&2
                  exit 1
                fi
                # `type=inline` could only ever carry the final image's own
                # layers, so the expensive builder stages were never restorable
                # from the registry and the only copy lived in buildkitd's local
                # state on the PVC -- exactly what a cancelled or killed daemon
                # loses. mode=max stores the builder stages too, so the
                # FlashInfer AOT layer survives loss of that local state.
                # ignore-error keeps a registry hiccup at the end of a
                # ignore-error stays: a registry hiccup must not fail a
                # multi-hour build; the shuttle below is the durable copy.
                # SHUTTLE_DIR lives on the buildkitd PVC mount (survives runs);
                # the flush solve runs AFTER the main solve so the
                # sharing=locked cache mounts are never held concurrently.
                SHUTTLE_DIR=/home/user/.local/share/buildkit/shuttle
                SHUTTLE_NEW_DIR=${SHUTTLE_DIR}.new
                rm -rf "$SHUTTLE_NEW_DIR"
                mkdir -p "$SHUTTLE_DIR"
                set +e
                buildctl build --frontend dockerfile.v0 \
                  --local context="$SRC" --local dockerfile="$SRC" \
                  --local shuttle-src="$SHUTTLE_DIR" \
                  --opt "context:shuttle-src=local:shuttle-src" \
                  --opt filename=homelab/spark-cross.Dockerfile \
                  --opt platform=linux/arm64 \
                  --opt build-arg:MAX_JOBS=4 \
                  --opt build-arg:CMAKE_BUILD_PARALLEL_LEVEL=4 \
                  --opt build-arg:NVCC_THREADS=1 \
                  --opt build-arg:VLLM_BUILD_COMMIT="$FULL_SHA" \
                  --opt build-arg:VLLM_SCM_VERSION="$SCM_VERSION" \
                  --opt build-arg:VLLM_IMAGE_TAG="$IMAGE_REF" \
                  --import-cache "type=registry,ref=${HARBOR_REGISTRY}/${IMAGE_NAME}:buildcache" \
                  --import-cache "type=registry,ref=${HARBOR_REGISTRY}/${IMAGE_NAME}:latest" \
                  --export-cache "type=registry,ref=${HARBOR_REGISTRY}/${IMAGE_NAME}:buildcache,mode=max,ignore-error=true" \
                  --output "type=image,\"name=${PUSH_NAMES}\",push=true"
                MAIN_RC=$?
                set -e
                # Shuttle flush: export to a sibling directory, then promote only
                # a complete result. The output layout includes /shuttle/ because
                # shuttle-flush copies /shuttle-out into that directory.
                rm -rf "$SHUTTLE_NEW_DIR"
                if buildctl build --frontend dockerfile.v0 \
                  --local context="$SRC" --local dockerfile="$SRC" \
                  --local shuttle-src="$SHUTTLE_DIR" \
                  --opt "context:shuttle-src=local:shuttle-src" \
                  --opt filename=homelab/spark-cross.Dockerfile \
                  --opt platform=linux/arm64 \
                  --opt build-arg:VLLM_SCM_VERSION="$SCM_VERSION" \
                  --opt target=shuttle-flush \
                  --output "type=local,dest=$SHUTTLE_NEW_DIR"; then
                  if [ -s "$SHUTTLE_NEW_DIR/shuttle/ccache.tgz" ] && \
                    [ -s "$SHUTTLE_NEW_DIR/shuttle/cubins.tgz" ]; then
                    mv "$SHUTTLE_NEW_DIR/shuttle/ccache.tgz" "$SHUTTLE_DIR/ccache.tgz"
                    mv "$SHUTTLE_NEW_DIR/shuttle/cubins.tgz" "$SHUTTLE_DIR/cubins.tgz"
                    echo "shuttle: promoted complete export"
                  else
                    echo "WARN: shuttle flush produced incomplete output; keeping prior export"
                  fi
                else
                  echo "WARN: shuttle flush failed; keeping prior export"
                fi
                rm -rf "$SHUTTLE_NEW_DIR"
                printf '%s' "$IMAGE_REF" > "$(results.IMAGE_REF.path)"
                printf '%s' "$SHORT_SHA" > "$(results.IMAGE_TAG.path)"
                printf '%s' "$PUSH_REF" > "$(results.PUSH_REF.path)"
                exit $MAIN_RC
              volumeMounts:
                - {name: dockerconfig, mountPath: /home/user/.docker}
                - {name: buildkitd, mountPath: /home/user/.local/share/buildkit}
            - name: verify-image
              image: gcr.io/go-containerregistry/crane:debug
              env:
                - {name: DOCKER_CONFIG, value: /tmp/docker}
              script: |
                #!/busybox/sh
                set -eu
                mkdir -p /tmp/docker
                cp /root/.docker/config.json /tmp/docker/config.json
                IMAGE_REF="$(cat "$(results.PUSH_REF.path)")"
                CONFIG="$(crane config "$IMAGE_REF")"
                printf '%s' "$CONFIG" | grep -q '"architecture":"arm64"' || {
                  echo "$IMAGE_REF is not an arm64 image" >&2
                  exit 1
                }
                DIGEST="$(crane digest "$IMAGE_REF")"
                case "$DIGEST" in
                  sha256:*) ;;
                  *) echo "Invalid image digest: $DIGEST" >&2; exit 1 ;;
                esac
                printf '%s@%s' "$IMAGE_REF" "$DIGEST" > "$(results.IMAGE_REF.path)"
              volumeMounts:
                - {name: dockerconfig, mountPath: /home/user/.docker}
                - {name: dockerconfig, mountPath: /root/.docker}
          volumes:
            - name: dockerconfig
              secret:
                secretName: "{{ docker_config_secret }}"
                items: [{key: .dockerconfigjson, path: config.json}]
            - name: buildkitd
              # Persistent PVC survives build reschedules on the node and holds
              # the cross-compile ccache + BuildKit layer cache (arm64 runtime
              # stage). Same PVC the manual cross-builds used, so the ccache is
              # warm.
              persistentVolumeClaim: {claimName: "{{ spark_buildkit_pvc }}"}
      - name: release
        runAfter: [build-and-push]
        params:
          - {name: repo_url, value: $(params.repo_url)}
          - {name: revision, value: $(params.revision)}
          - {name: git_ref, value: $(params.git_ref)}
          - {name: image_ref, value: $(tasks.build-and-push.results.IMAGE_REF)}
        workspaces:
          - {name: source, workspace: source}
        taskSpec:
          params:
            - {name: repo_url, type: string}
            - {name: revision, type: string}
            - {name: git_ref, type: string}
            - {name: image_ref, type: string}
          workspaces:
            - name: source
          steps:
            - name: prepare-release
              image: alpine/git:2.49.1
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                case "$TEKTON_GIT_REF" in
                  refs/tags/homelabs-verified-*) ;;
                  *) exit 0 ;;
                esac
                TAG="${TEKTON_GIT_REF#refs/tags/}"
                REPO="${TEKTON_REPO_URL#*github.com/}"
                REPO="${REPO%.git}"
                git config --global --add safe.directory "$PWD"
                git fetch --force --tags origin
                if git rev-parse --is-shallow-repository | grep -qx true; then
                  git fetch --force --unshallow origin
                fi
                TAG_SHA="$(git rev-list -n1 "$TAG")"
                if [ "$TAG_SHA" != "$TEKTON_REVISION" ]; then
                  echo "Tag $TAG resolves to $TAG_SHA, expected $TEKTON_REVISION" >&2
                  exit 1
                fi
                PREVIOUS_TAG="$(git tag --merged "$TAG" --list 'homelabs-verified-*' --sort=-version:refname | grep -Fxv "$TAG" | head -n1 || true)"
                {
                  printf 'Spark image: `%s`\n\n' "$TEKTON_IMAGE_REF"
                  if [ -n "$PREVIOUS_TAG" ]; then
                    printf '## Commits since %s\n\n' "$PREVIOUS_TAG"
                    git log --no-merges --format='- `%h` %s' "${PREVIOUS_TAG}..${TAG}"
                  else
                    printf 'Initial verified homelabs release; no prior verified tag exists.\n'
                  fi
                } > .release-body
                printf '%s' "$TAG" > .release-tag
                printf '%s' "$REPO" > .release-repo
              env:
                - {name: TEKTON_REPO_URL, value: $(params.repo_url)}
                - {name: TEKTON_REVISION, value: $(params.revision)}
                - {name: TEKTON_GIT_REF, value: $(params.git_ref)}
                - {name: TEKTON_IMAGE_REF, value: $(params.image_ref)}
            - name: create-release
              image: ghcr.io/cli/cli:2.78.0
              workingDir: $(workspaces.source.path)
              env:
                - name: GH_TOKEN
                  valueFrom:
                    secretKeyRef: {name: "{{ github_release_secret }}", key: token}
              script: |
                #!/bin/sh
                set -eu
                case "$(params.git_ref)" in
                  refs/tags/homelabs-verified-*) ;;
                  *) exit 0 ;;
                esac
                TAG="$(cat .release-tag)"
                REPO="$(cat .release-repo)"
                BODY="$(cat .release-body)"
                if RELEASE_ID="$(gh api "repos/${REPO}/releases/tags/${TAG}" --jq .id 2>/dev/null)"; then
                  gh api --method PATCH "repos/${REPO}/releases/${RELEASE_ID}" \
                    --raw-field "name=${TAG}" --raw-field "body=${BODY}" \
                    --field draft=false --field prerelease=false >/dev/null
                else
                  gh api --method POST "repos/${REPO}/releases" \
                    --raw-field "tag_name=${TAG}" \
                    --raw-field "target_commitish=$(params.revision)" \
                    --raw-field "name=${TAG}" --raw-field "body=${BODY}" \
                    --field draft=false --field prerelease=false >/dev/null
                fi
    finally:
      - name: notify-failure
        when:
          - {input: $(tasks.status), operator: in, values: [Failed]}
        taskSpec:
          steps:
            - name: notify
              image: curlimages/curl:8.5.0
              script: |
                #!/bin/sh
                if [ -n "${GOOGLE_CHAT_WEBHOOK_URL:-}" ]; then
                  curl -sf -X POST "$GOOGLE_CHAT_WEBHOOK_URL" \
                    -H 'Content-Type: application/json' \
                    -d '{"text":"vllm-spark-runtime image build failed"}'
                fi
              env:
                - name: GOOGLE_CHAT_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef: {name: "{{ notify_secret }}", key: url, optional: true}

# Manual retrigger: push a commit touching this file (pathChanged) to rebuild at
# HEAD. Source changes now trigger on their own; this is for the cases they do
# not cover, e.g. a moved base image or a changed Repository param.

