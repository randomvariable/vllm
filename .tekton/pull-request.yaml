apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  name: vllm-pull-request
  annotations:
    pipelinesascode.tekton.dev/on-cel-expression: |
      event == "pull_request" && target_branch == "homelabs-main" &&
      (".tekton/**".pathChanged() || "docker/**".pathChanged() ||
       "homelab/**".pathChanged() || "requirements/**".pathChanged() ||
       "vllm/**".pathChanged() || "csrc/**".pathChanged() ||
       "cmake/**".pathChanged() || "setup.py".pathChanged() ||
       "pyproject.toml".pathChanged() || "build*.sh".pathChanged())
spec:
  params:
    - name: repo_url
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
  taskRunTemplate:
    serviceAccountName: <REDACTED_SERVICE_ACCOUNT>
  pipelineSpec:
    params:
      - name: repo_url
        type: string
      - name: revision
        type: string
    workspaces:
      - name: source
      - name: basic-auth
    results:
      - name: source-sha
        value: $(tasks.source-identity.results.source-sha)
      - name: submodule-shas
        value: $(tasks.source-identity.results.submodule-shas)
    tasks:
      - name: clone
        taskRef:
          name: git-clone
        params:
          - name: url
            value: $(params.repo_url)
          - name: revision
            value: $(params.revision)
          - name: deleteExisting
            value: "true"
          - name: submodules
            value: "true"
        workspaces:
          - name: output
            workspace: source
          - name: basic-auth
            workspace: basic-auth
      - name: source-identity
        runAfter: [clone]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          results:
            - name: source-sha
            - name: submodule-shas
          steps:
            - name: verify
              image: cgr.dev/chainguard/git@sha256:REDACTED
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                case "$(params.revision)" in
                  ???????*) : ;;
                  *) echo 'revision must be a full SHA' >&2; exit 1 ;;
                esac
                actual=$(git rev-parse HEAD)
                test "$actual" = "$(params.revision)"
                printf '%s' "$actual" > "$(results.source-sha.path)"
                git submodule status --recursive | awk '{print $1}' | paste -sd, - > "$(results.submodule-shas.path)"
      - name: validate
        runAfter: [source-identity]
        workspaces:
          - name: source
            workspace: source
        taskSpec:
          workspaces:
            - name: source
          steps:
            - name: yaml
              image: python:3.12-alpine@sha256:REDACTED
              workingDir: $(workspaces.source.path)
              script: |
                #!/bin/sh
                set -eu
                python -c 'import pathlib, yaml; [yaml.safe_load(p.read_text()) for p in pathlib.Path(".tekton").glob("*.yaml")]'
                python -m compileall -q vllm
