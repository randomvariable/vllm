# ccache directory configuration for this checkout.
#
# ccache searches the current working directory and every ancestor for a file
# named ccache.conf, so this applies to compiles launched from anywhere in the
# tree - including the generated build/temp.* directory that Ninja runs in.
#
# Precedence: environment > this file > ~/.config/ccache/ccache.conf.
#
# Only build-semantics options are permitted here. Storage options (max_size,
# cache_dir) are rejected outright in a directory configuration and live in the
# user config instead; install that with:
#
#   make -C homelab -f Makefile.ccache install

# Key on the depfile Ninja already produces rather than running a second
# preprocessor pass over the FA/CUTLASS header trees. Without this, direct-mode
# lookups miss and the hit rate collapses to preprocessed-only.
depend_mode = true

# Toolchains are swapped in place here (CUDA 13.0 -> 13.3, ROCm nightlies), so
# identify compilers by content rather than mtime.
compiler_check = content

# The build directory is stable: FETCHCONTENT_BASE_DIR is pinned to .deps and
# setuptools builds in-tree, so the cwd need not participate in the hash.
hash_dir = false

# Configure regenerates sources and re-fetches dependencies with fresh
# timestamps every run; hashing content only is what lets direct-mode manifests
# survive across builds.
sloppiness = include_file_ctime,include_file_mtime,time_macros,pch_defines,modules,random_seed,file_stat_matches_ctime,system_headers

inode_cache = false
# ccache does not hash NVCC_PREPEND_FLAGS, so the effective cross-compile flags
# are carried into the cache key through this file (written by the Makefile's
# ccache-keyfile target). The option is `extra_files_to_hash`; `extra_files` is
# only the environment variable's short name (CCACHE_EXTRAFILES) and ccache
# rejects it in a config file as an unknown option, which aborts every compile.
extra_files_to_hash = /root/.cache/ccache/keyfile
# stats_log is deliberately absent: ccache 4.13 classes it unsafe in a directory
# configuration unless the directory is listed in safe_dirs, and rejecting one
# option aborts the whole compile. Set CCACHE_STATSLOG per environment instead.

# Not set here on purpose: base_dir must be an absolute path, and it differs
# between the host checkout and the devloop container's /src/vllm mount. Export
# CCACHE_BASEDIR per environment if you want both to share cache entries.
