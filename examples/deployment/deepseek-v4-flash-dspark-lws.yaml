# Public example only. Replace image and model values in a deployment overlay.
# The image must come from .tekton/image-build.yaml and remain digest-qualified.
apiVersion: leaderworkerset.x-k8s.io/v1
kind: LeaderWorkerSet
metadata:
  name: deepseek-v4-flash-dspark
spec:
  replicas: 1
  leaderWorkerTemplate:
    size: 2
    restartPolicy: RecreateGroupOnPodRestart
    leaderTemplate:
      metadata:
        labels:
          app: deepseek-v4-flash-dspark
          role: leader
      spec:
        serviceAccountName: <REDACTED_SERVICE_ACCOUNT>
        containers:
          - name: leader
            image: <REDACTED_REGISTRY>/<REDACTED_REPOSITORY>@sha256:<REDACTED_DIGEST>
            command: [vllm, serve]
            args: ["<MODEL_ID>", "--tensor-parallel-size=2", "--distributed-executor-backend=mp"]
            env:
              - name: VLLM_HOST_IP
                valueFrom: {fieldRef: {fieldPath: status.podIP}}
              - name: VLLM_USE_B12X_MOE
                value: "1"
              - name: VLLM_DSPARK_CAPACITY_ENABLE
                value: "0"
            ports: [{name: modelserver, containerPort: 8000}]
            securityContext:
              capabilities: {add: [IPC_LOCK]}
            readinessProbe:
              httpGet: {path: /health, port: modelserver}
              periodSeconds: 10
        nodeSelector:
          kubernetes.io/arch: arm64
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector: {matchLabels: {app: deepseek-v4-flash-dspark}}
                topologyKey: kubernetes.io/hostname
    workerTemplate:
      metadata:
        labels: {app: deepseek-v4-flash-dspark, role: worker}
      spec:
        containers:
          - name: worker
            image: <REDACTED_REGISTRY>/<REDACTED_REPOSITORY>@sha256:<REDACTED_DIGEST>
            command: [vllm, serve]
            args: ["<MODEL_ID>", "--tensor-parallel-size=2", "--distributed-executor-backend=mp"]
            env:
              - name: VLLM_HOST_IP
                valueFrom: {fieldRef: {fieldPath: status.podIP}}
            securityContext:
              capabilities: {add: [IPC_LOCK]}
        nodeSelector: {kubernetes.io/arch: arm64}
---
apiVersion: v1
kind: Service
metadata:
  name: deepseek-v4-flash-dspark-leader
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: deepseek-v4-flash-dspark
    role: leader
  ports:
    - name: modelserver
      port: 8000
      targetPort: modelserver
