# User-level ccache configuration for vLLM native builds (CUDA sm_12x, ROCm
# gfx1151). Install with:
#
#   make -C homelab -f Makefile.ccache install
#
# This file carries only what a directory configuration cannot: ccache rejects
# max_size and cache_dir in a per-directory config. Build-semantics options
# (depend_mode, compiler_check, hash_dir, sloppiness, inode_cache) live in the
# checkout's own ./ccache.conf, which ccache picks up from the cwd
# or any ancestor - including the build/temp.* directory Ninja runs in - and
# which takes precedence over this file.

# A single full vLLM CUDA build emits thousands of multi-MB objects. The 5 GiB
# default evicts a build's own objects before the next build can reuse them,
# which presents as a ~0% hit rate on a cache permanently pinned at max.
max_size = 150G
