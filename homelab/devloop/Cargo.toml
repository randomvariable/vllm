[workspace]

[package]
name = "vllm-devloop"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Incremental build/test harness for vLLM on AMD Strix Halo (gfx1151)"
publish = false

[[bin]]
name = "vllm-devloop"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
fd-lock = "4.0.4"

[lints.rust]
unsafe_code = "forbid"
